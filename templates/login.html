<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כניסה — מעקב שעות עבודה</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-light: #eff6ff;
    --border: #e2e8f0;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
    --text-muted: #64748b;
    --red: #dc2626;
    --red-light: #fef2f2;
    --shadow-md: 0 4px 12px rgba(0,0,0,.1);
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
  }
  .login-logo {
    font-size: 28px;
    font-weight: 700;
    color: var(--primary);
    text-align: center;
    margin-bottom: 6px;
  }
  .login-subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 28px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 16px;
  }
  .form-group label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .form-group input {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--card);
    transition: border-color .15s;
    width: 100%;
  }
  .form-group input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,.1);
  }
  .btn-login {
    width: 100%;
    padding: 11px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-top: 8px;
    transition: background .15s;
  }
  .btn-login:hover { background: #1d4ed8; }
  .btn-login:active { background: #1e40af; }
  .error-box {
    background: var(--red-light);
    border: 1px solid #fca5a5;
    border-radius: var(--radius-sm);
    color: var(--red);
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">⏱ שעות עבודה</div>
  <div class="login-subtitle">היכנס כדי להמשיך</div>

  {% if error %}
  <div class="error-box">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="form-group">
      <label for="email">אימייל</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">סיסמה</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-login">כניסה</button>
  </form>
</div>
</body>
</html>
